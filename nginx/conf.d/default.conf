# Vhost utama: nginx sebagai reverse proxy menuju Docker Registry v2.
server {
    listen 80;
    server_name _;

    client_max_body_size 0;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;

    # Health check (dipakai Railway via healthcheckPath dan Docker HEALTHCHECK)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        # Diisi oleh entrypoint.sh: berisi auth_basic bila diaktifkan
        include /etc/nginx/conf.d/auth.inc;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://127.0.0.1:5000;

        # Timeout longgar untuk push/pull layer besar
        proxy_connect_timeout 75s;
        proxy_read_timeout    900s;
        proxy_send_timeout    900s;
    }
}
